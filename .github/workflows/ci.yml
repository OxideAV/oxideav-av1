name: CI

# Thin shim around the OxideAV org-level reusable workflow. See
# https://github.com/OxideAV/.github for the actual job definitions and
# the input surface. Miri runs by default per the org-wide policy.
#
# Tiered since round 429: the full conformance suite (111-pin
# triple-decode corpus + A/B harnesses) runs 4+ hours on the slower
# hosted runners — long enough to hit hosted-runner mortality — so the
# per-push matrix is split:
#   * ci      — FULL suite on ubuntu + macos (complete coverage per push)
#   * ci-win  — build + `cargo test --lib` on windows (2100+ unit tests;
#               platform build/behaviour smoke without the corpus wall)
# Nothing is dropped: every test still runs per-push on two platforms;
# Windows corpus coverage is available on demand by dispatching `ci`
# with a windows os_matrix from the Actions UI.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    uses: OxideAV/.github/.github/workflows/crate-ci.yml@master
    with:
      os_matrix: '["ubuntu-latest", "macos-latest"]'
    secrets: inherit
  ci-win:
    uses: OxideAV/.github/.github/workflows/crate-ci.yml@master
    with:
      os_matrix: '["windows-latest"]'
      extra_test_args: "--lib"
    secrets: inherit
  # #33 — bare WebAssembly. `wasm32-unknown-unknown` compiles
  # `Instant::now()` and `thread::spawn` but traps on them at run time,
  # so the library check is backed by a run: `wasm-probe/` decodes a
  # resize + superres stream under a 4-worker budget and encodes a
  # still under a 4-thread budget, and its digest must equal the
  # native one (pinned in `wasm-probe/src/lib.rs`, checked natively by
  # `cargo test` there).
  wasm32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain + wasm32-unknown-unknown target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - name: Library check (wasm32-unknown-unknown)
        run: cargo check --target wasm32-unknown-unknown
      - name: Native digest
        working-directory: wasm-probe
        run: cargo test --release
      - name: Probe build (wasm32-unknown-unknown)
        working-directory: wasm-probe
        run: cargo build --release --target wasm32-unknown-unknown
      - name: Probe run (Node, no imports)
        working-directory: wasm-probe
        run: node run.mjs target/wasm32-unknown-unknown/release/oxideav_av1_wasm_probe.wasm
