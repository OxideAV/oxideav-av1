# Deep spec-driver decode/encode recursion overflows the default
# spawned-thread stack in debug `cargo test` builds on the
# smaller-default-stack runners (Windows especially). The r431 KEY
# delta-q dispatcher (§5.9.17) tipped
# `encoder::key_frame::tests::r418_search_selects_intrabc_on_tiled_content`
# over `STATUS_STACK_OVERFLOW` on the windows-debug leg while
# ubuntu/macos passed. Reserve 16 MiB for libtest's per-test threads —
# virtual-address-space only, no runtime cost, output-invariant.
[env]
RUST_MIN_STACK = "16777216"

# r439 CI-latency fix: the full conformance suite (126-pin triple-decode
# corpus + A/B harnesses) ran 5h+ per push at the default debug
# opt-level and brushed the 6-hour hosted-runner cap. Optimised
# codegen for dev/test profiles cuts the encoder/decoder hot loops by
# an order of magnitude; debug assertions remain enabled (they are
# independent of opt-level), so the suite's assert coverage is
# unchanged. Applies wherever cargo runs with this directory as the
# manifest root — CI checkouts and per-crate local runs alike.
[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2
